services:
  petlora:
    build:
      context: .
    image: dinov2-lora-pets:latest
    shm_size: 2gb
    working_dir: /workspace
    environment:
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-sqlite:////workspace/mlflow.db}
    volumes:
      - .:/workspace
      - huggingface-cache:/root/.cache/huggingface
    init: true

volumes:
  huggingface-cache:
